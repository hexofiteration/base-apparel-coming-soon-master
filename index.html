<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Base Apparel coming soon page</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <header class="header">
      <img src="./images/logo.svg" alt="" />
    </header>
    <div class="hero">
      <picture>
        <source media="(max-width: 800px)" srcset="./images/hero-mobile.jpg" />
        <img src="./images/hero-desktop.jpg" alt="" />
      </picture>
    </div>
    <main class="main">
      <article class="article">
        <h1 class="heading">We're coming soon</h1>
        <p class="description">
          We're coming soon Hello fellow shoppers! We're currently building our
          new fashion store. Add your email below to stay up-to-date with
          announcements and our launch deals.
        </p>
      </article>
      <form>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Email Address"
          pattern=".+@example\.com"
          required
        />
        <button><img src="./images/icon-arrow.svg" alt="" /></button>
      </form>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
